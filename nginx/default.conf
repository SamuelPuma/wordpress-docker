# Define el servidor web.
server {
    # Escucha en el puerto 80 del contenedor.
    listen 80;

    # Acepta cualquier nombre de servidor.
    server_name _;

    # Carpeta donde se encuentran los archivos de WordPress.
    root /var/www/html;

    # Archivo principal del sitio.
    index index.php;

    # Permite peticiones de hasta 64 MB.
    client_max_body_size 64M;

    # Configura las rutas del sitio.
    location / {
        # Si no encuentra la ruta, utiliza WordPress.
        try_files $uri $uri/ /index.php?$args;
    }

    # Configura el procesamiento de archivos PHP.
    location ~ \.php$ {
        # Incluye los parámetros necesarios para PHP-FPM.
        include fastcgi_params;

        # Envía las peticiones PHP al servicio WordPress.
        fastcgi_pass wordpress:9000;

        # Indica qué archivo PHP debe ejecutarse.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}